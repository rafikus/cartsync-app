name: EAS Build and Release

on:
  push:
    branches:
      - master
    paths:
      - 'app.json'

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version-changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if version changed
        id: check
        run: |
          CURRENT_VERSION=$(jq -r '.expo.version' app.json)
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          
          git checkout HEAD~1 -- app.json 2>/dev/null || echo "First commit"
          PREVIOUS_VERSION=$(jq -r '.expo.version' app.json 2>/dev/null || echo "0.0.0")
          git checkout HEAD -- app.json
          
          echo "Current version: $CURRENT_VERSION"
          echo "Previous version: $PREVIOUS_VERSION"
          
          if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Version changed from $PREVIOUS_VERSION to $CURRENT_VERSION"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Version unchanged"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.version-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install

      - name: Build APK
        id: start-build
        run: |
          BUILD_OUTPUT=$(eas build --platform android --profile production --non-interactive --no-wait 2>&1)
          echo "$BUILD_OUTPUT"
          
          # Extract build ID from output
          BUILD_ID=$(echo "$BUILD_OUTPUT" | grep -oP 'https://expo.dev/accounts/[^/]+/projects/[^/]+/builds/\K[a-f0-9-]+' | head -1)
          
          if [ -z "$BUILD_ID" ]; then
            # Fallback: get the most recent build for this platform
            echo "Could not extract build ID from output, fetching latest build..."
            sleep 5
            BUILD_ID=$(eas build:list --platform android --limit 1 --json --non-interactive | jq -r '.[0].id')
          fi
          
          echo "Build ID: $BUILD_ID"
          echo "build-id=$BUILD_ID" >> $GITHUB_OUTPUT
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Wait for build to complete
        id: build
        run: |
          BUILD_ID="${{ steps.start-build.outputs.build-id }}"
          
          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "null" ]; then
            echo "Error: No build ID found"
            exit 1
          fi
          
          echo "Monitoring build: $BUILD_ID"
          
          # Wait for build to complete (check every 30 seconds)
          MAX_WAIT=7200  # 2 hours
          ELAPSED=0
          
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            BUILD_INFO=$(eas build:view $BUILD_ID --json 2>&1)
            STATUS=$(echo "$BUILD_INFO" | jq -r '.status' 2>/dev/null || echo "unknown")
            
            echo "Build status: $STATUS (elapsed: ${ELAPSED}s)"
            
            if [ "$STATUS" = "finished" ]; then
              echo "Build completed successfully"
              APK_URL=$(echo "$BUILD_INFO" | jq -r '.artifacts.buildUrl')
              echo "APK URL: $APK_URL"
              echo "apk-url=$APK_URL" >> $GITHUB_OUTPUT
              break
            elif [ "$STATUS" = "errored" ] || [ "$STATUS" = "canceled" ]; then
              echo "Build failed with status: $STATUS"
              echo "$BUILD_INFO" | jq '.'
              exit 1
            elif [ "$STATUS" = "unknown" ]; then
              echo "Warning: Could not fetch build status"
            fi
            
            sleep 30
            ELAPSED=$((ELAPSED + 30))
          done
          
          if [ $ELAPSED -ge $MAX_WAIT ]; then
            echo "Build timed out after ${MAX_WAIT}s"
            exit 1
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download APK
        run: |
          curl -L -o CartSync-v${{ needs.check-version.outputs.version }}.apk "${{ steps.build.outputs.apk-url }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: Release v${{ needs.check-version.outputs.version }}
          body: |
            ## CartSync v${{ needs.check-version.outputs.version }}
            
            ### Installation
            Download the APK file below and install it on your Android device.
            
            **Note:** You may need to enable "Install from Unknown Sources" in your device settings.
          files: |
            CartSync-v${{ needs.check-version.outputs.version }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
